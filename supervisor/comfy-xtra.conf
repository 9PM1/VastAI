[program:comfy-xtra]
environment=PROC_NAME="%(program_name)s"
command=/opt/comfy-xtra/supervisor/comfy-xtra.sh
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
